  - text: 管理中心
  - heading "密钥链管理" [level=1]
  - paragraph: 各服务密钥按三层链解析：环境变量 > secrets 文件覆盖 > 内置默认。本页只展示来源层（零明文）；覆盖值写回 secrets 文件，进程重启后生效。
  - text: 覆盖写入目标：config/secrets.local.toml
  - button "刷新状态"
  - heading "密钥链状态" [level=2]
  - paragraph: 装配期逐键记录的生效来源；env 层无法经本页覆盖（需在部署环境配置）。
  - region "密钥链状态列表（可横向滚动）":
    - table:
      - rowgroup:
        - row "密钥 生效来源 是否已配置":
          - columnheader "密钥"
          - columnheader "生效来源"
          - columnheader "是否已配置"
      - rowgroup:
        - row "providers.tmdb.api_key 内置默认（项目方） 已配置":
          - cell "providers.tmdb.api_key"
          - cell "内置默认（项目方）"
          - cell "已配置"
        - row "providers.douban.api_key 内置默认（项目方） 已配置":
          - cell "providers.douban.api_key"
          - cell "内置默认（项目方）"
          - cell "已配置"
        - row "providers.bangumi.access_token 未配置 未配置":
          - cell "providers.bangumi.access_token"
          - cell "未配置"
          - cell "未配置"
        - row "providers.onedrive.client_id 未配置 未配置":
          - cell "providers.onedrive.client_id"
          - cell "未配置"
          - cell "未配置"
        - row "providers.scrape_server.api_key 未配置 未配置":
          - cell "providers.scrape_server.api_key"
          - cell "未配置"
          - cell "未配置"
        - row "providers.hash_service.api_key 未配置 未配置":
          - cell "providers.hash_service.api_key"
          - cell "未配置"
          - cell "未配置"
        - row "providers.mediasvc.api_key 内置默认（项目方） 已配置":
          - cell "providers.mediasvc.api_key"
          - cell "内置默认（项目方）"
          - cell "已配置"
        - row "providers.mediasvc.token 内置默认（项目方） 已配置":
          - cell "providers.mediasvc.token"
          - cell "内置默认（项目方）"
          - cell "已配置"
        - row "providers.telegram.bot_token 未配置 未配置":
          - cell "providers.telegram.bot_token"
          - cell "未配置"
          - cell "未配置"
        - row "providers.telegram.webhook_secret 未配置 未配置":
          - cell "providers.telegram.webhook_secret"
          - cell "未配置"
          - cell "未配置"
        - row "providers.ai.endpoint 未配置 未配置":
          - cell "providers.ai.endpoint"
          - cell "未配置"
          - cell "未配置"
        - row "providers.ai.api_key 未配置 未配置":
          - cell "providers.ai.api_key"
          - cell "未配置"
          - cell "未配置"
        - row "providers.ai.model_name 未配置 未配置":
          - cell "providers.ai.model_name"
          - cell "未配置"
          - cell "未配置"
  - paragraph: 微软网盘双版本自建应用凭据（global / china_21vianet）由 providers 内置混淆常量分发，不在本页覆盖面。
  - heading "覆盖写入" [level=2]
  - paragraph: 写入 secrets 文件（等价“文件层”）；不热更新运行中进程，重启后生效。留空值勾选“删除覆盖”可恢复下层回退。
  - text: 密钥
  - combobox "密钥":
    - option "选择要覆盖的密钥…" [selected]
    - option "providers.tmdb.api_key"
    - option "providers.douban.api_key"
    - option "providers.onedrive.client_id"
    - option "providers.scrape_server.api_key"
    - option "providers.hash_service.api_key"
    - option "providers.mediasvc.api_key"
    - option "providers.mediasvc.token"
    - option "providers.telegram.bot_token"
    - option "providers.ai.endpoint"
    - option "providers.ai.api_key"
    - option "providers.ai.model_name"
  - text: 覆盖值
  - textbox "覆盖值":
    - /placeholder: 输入新值（写盘后本页不回显）
  - checkbox "删除该键的文件覆盖（值置空，恢复 env/builtin 层回退）"
  - text: 删除该键的文件覆盖（值置空，恢复 env/builtin 层回退）
  - button "写入覆盖" [disabled]