<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>Darkroom 预览 · 首页 Hero</title>
<style>/*
 * ============================================================
 * Darkroom 设计 Token（兼容旧版 FMBY / aurora-glass token 命名）
 * ============================================================
 *
 * 设计原则（暗房）：
 *   1. 画布是纯黑。界面本身不发光，发光的只有内容。
 *   2. 没有卡片、没有毛玻璃、没有渐变装饰。层级靠「极细线 + 微提亮」建立。
 *   3. 品牌色不是固定值 —— 浏览态由当前封面主色驱动（--content-accent），
 *      管理态用固定的暗房安全灯琥珀（--safelight）。
 *   4. 圆角接近直角，投影只用于把海报从黑底里「托」起来。
 *
 * 兼容性：保留旧皮肤全部变量名（--glass-*、--aurora-*、--brand-gold 等），
 * 仅改变取值，因此下游 CSS Module 无需改动即可整体换肤。
 */

:root {
  /* ============================================================
   * 画布
   * ============================================================ */
  --bg-base: #000000;
  --bg-immersive: #000000;
  /* 需要与黑底分离的浮层（对话框、抽屉、下拉）使用的实底 */
  --bg-raised: #0d0d0f;
  --bg-raised-strong: #141417;

  /* ============================================================
   * 内容主色（运行时由 useAmbientAccent 覆写）
   * ------------------------------------------------------------
   * --content-accent-rgb 为空格分隔的 RGB 分量，配合
   * rgb(var(--content-accent-rgb) / <alpha>) 使用。
   * JS 侧会把提取到的封面主色归一到 L≈68%、S≤70%，保证任何封面下
   * 文本对比度都安全。
   * ============================================================ */
  --content-accent: #ffffff;
  --content-accent-rgb: 255 255 255;
  --content-accent-soft: rgb(var(--content-accent-rgb) / 0.16);
  --content-accent-line: rgb(var(--content-accent-rgb) / 0.42);
  /* 环境光强度：0 关闭氛围光，1 默认 */
  --ambient-strength: 1;

  /* 暗房安全灯：管理态唯一强调色 */
  --safelight: #ffb454;
  --safelight-hover: #ffc57a;
  --safelight-active: #f0a03a;
  --safelight-soft: rgba(255, 180, 84, 0.12);
  --safelight-line: rgba(255, 180, 84, 0.34);

  /* ============================================================
   * 材质（旧 glass-* 命名保留，取值已去玻璃化）
   * ------------------------------------------------------------
   * --glass-blur 归零 ⇒ 全站 backdrop-filter: blur(var(--glass-blur))
   * 自动失效，无需逐个文件删除。
   * ============================================================ */
  --glass-bg: rgba(255, 255, 255, 0.028);
  /* 浮层用实底，避免纯黑背景下对话框「看不见」 */
  --glass-bg-strong: #101012;
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-glow: rgba(255, 255, 255, 0.2);
  --glass-blur: 0px;
  --glass-blur-heavy: 0px;
  --glass-inner-glow: none;

  /* 表面：极微提亮，用于分区而非「卡片」 */
  --surface-1: rgba(255, 255, 255, 0.024);
  --surface-2: rgba(255, 255, 255, 0.045);
  --surface-3: rgba(255, 255, 255, 0.072);

  /* ============================================================
   * 文本
   * ============================================================ */
  --text-1: rgba(255, 255, 255, 0.94);
  --text-2: rgba(255, 255, 255, 0.62);
  --text-3: rgba(255, 255, 255, 0.38);
  --text-4: rgba(255, 255, 255, 0.26);
  /* 旧命名映射 */
  --text-primary: var(--text-1);
  --text-secondary: var(--text-2);
  --text-muted: var(--text-3);
  --text-tertiary: var(--text-4);

  /* ============================================================
   * 强调色（旧命名映射）
   * ------------------------------------------------------------
   * 暗房方案里主操作是「白底黑字」，不跟随封面色，保证任何封面下
   * 都可读；封面色只驱动氛围光、进度、选中描边。
   * ============================================================ */
  --brand-gold: #ffffff;
  --brand-gold-hover: rgba(255, 255, 255, 0.86);
  --brand-gold-active: rgba(255, 255, 255, 0.72);
  --manage-cyan: var(--safelight);
  --manage-cyan-hover: var(--safelight-hover);
  --manage-cyan-active: var(--safelight-active);
  --accent-blue: rgba(255, 255, 255, 0.86);
  /* 此前被引用但从未定义的两个变量，在此补齐 */
  --accent: var(--content-accent);
  --accent-cyan: var(--safelight);

  /* 极光色不再表示极光，退化为中性/内容色的别名（保留命名兼容） */
  --aurora-1: var(--content-accent);
  --aurora-2: rgba(255, 255, 255, 0.9);
  --aurora-3: rgba(255, 255, 255, 0.55);
  --aurora-4: var(--safelight);

  /* ============================================================
   * 语义色（为纯黑底提亮、降饱和）
   * ============================================================ */
  --success: #5fd3a6;
  --warning: #ffb454;
  --danger: #ff7b72;
  --info: #8ab4f8;

  --success-glass-bg: rgba(95, 211, 166, 0.1);
  --success-glass-border: rgba(95, 211, 166, 0.3);
  --warn-glass-bg: rgba(255, 180, 84, 0.1);
  --warn-glass-border: rgba(255, 180, 84, 0.3);
  --warning-glass-bg: var(--warn-glass-bg);
  --warning-glass-border: var(--warn-glass-border);
  --danger-glass-bg: rgba(255, 123, 114, 0.1);
  --danger-glass-border: rgba(255, 123, 114, 0.3);
  --info-glass-bg: rgba(138, 180, 248, 0.1);
  --info-glass-border: rgba(138, 180, 248, 0.3);
  --neutral-glass-bg: rgba(255, 255, 255, 0.05);
  --neutral-glass-border: rgba(255, 255, 255, 0.14);

  /* ============================================================
   * 线（暗房只有极细线，没有描边卡片）
   * ============================================================ */
  --border-subtle: rgba(255, 255, 255, 0.055);
  --border-muted: rgba(255, 255, 255, 0.08);
  --border-default: rgba(255, 255, 255, 0.11);
  --border-strong: rgba(255, 255, 255, 0.2);
  --hairline: rgba(255, 255, 255, 0.07);

  /* ============================================================
   * 字体系统
   * ============================================================ */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC',
    'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'IBM Plex Mono',
    Consolas, monospace;

  /* 暗房：大标题走细体大字号，与浓黑底形成安静的对比 */
  --text-display: clamp(38px, 5vw, 62px);
  --text-h1: 26px;
  --text-h2: 19px;
  --text-h3: 15px;
  --text-body-lg: 15px;
  --text-body: 14px;
  --text-body-sm: 13px;
  --text-caption: 12px;
  --text-mono: 12px;

  --font-weight-light: 300;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* 字距：暗房大量使用宽字距小字号做「标签」 */
  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.16em;
  --tracking-widest: 0.32em;

  /* ============================================================
   * 间距
   * ============================================================ */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ============================================================
   * 栅格
   * ============================================================ */
  --grid-max-width: 1760px;
  --grid-gutter-desktop: 24px;
  --grid-gutter-tablet: 20px;
  --grid-gutter-mobile: 12px;
  --grid-margin: clamp(16px, 3vw, 40px);

  /* ============================================================
   * 断点（语义变量，供 JS / 文档消费）
   * ============================================================ */
  --bp-xs: 414px;
  --bp-sm: 768px;
  --bp-md: 1024px;
  --bp-lg: 1280px;
  --bp-xl: 1536px;
  --bp-2xl: 1920px;
  --bp-3xl: 2560px;

  --cq-xs: 320px;
  --cq-sm: 480px;
  --cq-md: 720px;
  --cq-lg: 960px;
  --cq-xl: 1200px;

  --touch-min: 44px;
  --touch-min-comfortable: 48px;
  --text-mobile-min: 14px;

  --safe-area-top: env(safe-area-inset-top, 0px);
  --safe-area-bottom: env(safe-area-inset-bottom, 0px);
  --safe-area-left: env(safe-area-inset-left, 0px);
  --safe-area-right: env(safe-area-inset-right, 0px);

  /* ============================================================
   * 圆角（暗房接近直角）
   * ============================================================ */
  --radius-sm: 3px;
  --radius-md: 5px;
  --radius-lg: 8px;
  --radius-card: 3px;
  --radius-full: 9999px;

  /* ============================================================
   * 投影 / 辉光
   * ------------------------------------------------------------
   * 纯黑底上普通投影不可见，因此投影只服务于「把海报托起来」，
   * 层级分离改用 --glow-* 与极细线。
   * ============================================================ */
  --shadow-l1: 0 10px 24px -12px rgba(0, 0, 0, 0.9);
  --shadow-l2: 0 20px 48px -18px rgba(0, 0, 0, 0.95);
  --shadow-l3: 0 34px 80px -24px rgba(0, 0, 0, 1);

  --glow-accent: 0 0 60px -14px rgb(var(--content-accent-rgb) / 0.55);
  --glow-focus: 0 0 0 1px rgba(255, 255, 255, 0.9);
  --ring-selected: 0 0 0 1px rgba(255, 255, 255, 0.85);

  /* ============================================================
   * 动效
   * ============================================================ */
  --duration-micro: 180ms;
  --duration-fast: 150ms;
  --duration-panel: 260ms;
  --duration-page: 320ms;
  --duration-hero: 400ms;
  --duration-ambient: 900ms;
  --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  --motion-fast: var(--duration-fast);
  --motion-panel: var(--duration-panel);
  --motion-page: var(--duration-page);

  /* ============================================================
   * 层级
   * ============================================================ */
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-modal: 300;
  --z-toast: 400;
  --z-tooltip: 500;

  /* ============================================================
   * 布局
   * ============================================================ */
  --topbar-height-desktop: 64px;
  --topbar-height-tablet: 60px;
  --topbar-height-mobile: 56px;
  --manage-rail-width: 272px;
}

/*
 * 管理态：整体切到安全灯语汇。
 * ManageLayout 根节点加 data-surface="manage" 即可生效。
 */
[data-surface='manage'] {
  --content-accent: var(--safelight);
  --content-accent-rgb: 255 180 84;
  /* 管理态不需要氛围光，信息密度优先 */
  --ambient-strength: 0;
}

/* 减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-micro: 0ms;
    --duration-fast: 0ms;
    --duration-panel: 0ms;
    --duration-page: 0ms;
    --duration-hero: 0ms;
    --duration-ambient: 0ms;
  }
}
</style>
<style>/*
 * ============================================================
 * Darkroom 环境光层（沿用文件名 aurora.css 以免改动 main.tsx 导入顺序）
 * ============================================================
 *
 * 暗房里唯一的光源是「正在看的那张封面」。
 * 这里只做两件事：
 *   1. body::before —— 一团跟随 --content-accent 的极低亮度辉光，
 *      位置固定在视口偏上方，模拟封面从画面深处透出来的光。
 *   2. body::after  —— 一层暗角，把注意力压回画面中心。
 *
 * 强度由 --ambient-strength 控制（管理态置 0，直接关灯）。
 * 颜色切换走 --duration-ambient 过渡，避免换封面时突兀跳色。
 */

body {
  background-color: var(--bg-base);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  opacity: var(--ambient-strength, 1);
  background-color: var(--bg-base);
  background-image:
    radial-gradient(
      70% 55% at 68% 8%,
      rgb(var(--content-accent-rgb) / 0.15),
      transparent 70%
    ),
    radial-gradient(
      50% 40% at 20% 78%,
      rgb(var(--content-accent-rgb) / 0.055),
      transparent 72%
    );
  background-repeat: no-repeat;
  transition:
    background-image var(--duration-ambient, 900ms) var(--ease-default),
    opacity var(--duration-ambient, 900ms) var(--ease-default);
  will-change: opacity;
}

/* 暗角：越靠边越黑，强化「一束光打在中间」 */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(
    120% 100% at 50% 38%,
    transparent 42%,
    rgba(0, 0, 0, 0.55) 100%
  );
}

/*
 * 沉浸态（播放页等）：彻底关灯，只剩画面。
 * 用法：在页面根节点加 data-surface="immersive"。
 */
[data-surface='immersive'] {
  --ambient-strength: 0;
}

@media (prefers-reduced-motion: reduce) {
  body::before {
    transition: none;
    will-change: auto;
  }
}
</style>
<style>/*
 * ============================================================
 * Darkroom 全局基础样式
 * ============================================================
 *
 * 包含：CSS Reset（最小化）、排版默认值、暗房滚动条、焦点环。
 */

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  color-scheme: dark;
  background-color: var(--bg-base);
}

body {
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: 1.6;
  color: var(--text-1);
  background-color: var(--bg-base);
  min-height: 100vh;
  -webkit-overflow-scrolling: touch;
  -webkit-tap-highlight-color: transparent;
}

#root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 0;
}

/* ---- 链接：暗房里链接不用蓝色，用亮度区分 ---- */
a {
  color: var(--text-1);
  text-decoration: none;
  transition: color var(--duration-micro) var(--ease-default);
}

a:hover {
  color: #fff;
}

/* ---- 图片 / 视频 ---- */
img,
video {
  max-width: 100%;
  height: auto;
  display: block;
}

/* ---- 按钮 Reset ---- */
button {
  cursor: pointer;
  border: none;
  background: none;
  font: inherit;
  color: inherit;
}

button:disabled {
  cursor: not-allowed;
}

/* ---- 表单默认 ---- */
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

::placeholder {
  color: var(--text-4);
}

/* ---- 列表 ---- */
ul,
ol {
  list-style: none;
}

/* ---- 文本选中：跟随内容主色 ---- */
::selection {
  background: rgb(var(--content-accent-rgb) / 0.3);
  color: #fff;
}

/* ---- 滚动条：暗房里滚动条几乎不可见，hover 才浮现 ---- */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background-color: rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-full);
  transition: background-color var(--duration-fast) var(--ease-default);
}

::-webkit-scrollbar-thumb:hover {
  background-color: rgba(255, 255, 255, 0.22);
}

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
}

/* ---- Focus 可见性：白色细环，纯黑底上最清晰 ---- */
:focus-visible {
  outline: 1px solid rgba(255, 255, 255, 0.9);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
</style>
<style>/*
 * Darkroom · 首页 HeroSpotlight
 * ------------------------------------------------------------
 * 没有卡片、没有边框、没有圆角容器。整块 hero 就是一张从黑里
 * 浮出来的画面：右侧封面用径向遮罩羽化进纯黑，左侧文字直接压在黑上。
 * 类名与 HeroSpotlight.tsx 完全一致，仅改视觉。
 */

/* ============ 容器 ============ */
.hero {
  position: relative;
  border: none;
  border-radius: 0;
  background: transparent;
  overflow: hidden;
  min-height: clamp(380px, 48vw, 520px);
  display: flex;
}

.heroBackground {
  position: absolute;
  inset: 0;
  z-index: 0;
}

/*
 * 原「大面积模糊底图」在暗房里改为极弱的色雾：
 * 只负责把封面的色温洇进黑底，不负责成像。
 */
.heroBackgroundBlur {
  position: absolute;
  inset: -60px;
  background-size: cover;
  background-position: center;
  filter: blur(72px) saturate(1.35) brightness(0.3);
  opacity: 0.4;
  transform: scale(1.15);
  /* 同样羽化，避免色雾在容器边界留下一条比纯黑略亮的直边 */
  mask-image: radial-gradient(58% 76% at 62% 40%, #000 10%, transparent 82%);
  -webkit-mask-image: radial-gradient(58% 76% at 62% 40%, #000 10%, transparent 82%);
}

.heroBackgroundFrame {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: flex-end;
}

/* 双向羽化：右侧成像，向左、向下、向上都溶进纯黑 */
.heroBackgroundImage {
  height: 100%;
  width: min(84%, 1120px);
  object-fit: cover;
  object-position: 58% 32%;
  opacity: 0.95;
  /* rx/ry 与圆心经过计算：四边都在盒子边界前完全透明，绝不出现硬切边 */
  mask-image: radial-gradient(42% 76% at 66% 38%, #000 18%, transparent 80%);
  -webkit-mask-image: radial-gradient(42% 76% at 66% 38%, #000 18%, transparent 80%);
}

/* 左侧压黑，保证文字始终可读；右侧完全透明，不遮画面 */
.heroLayout {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 26px;
  width: 100%;
  padding: clamp(24px, 3.5vw, 48px) clamp(20px, 3.5vw, 40px);
  background: linear-gradient(
    98deg,
    #000 0%,
    rgba(0, 0, 0, 0.82) 26%,
    rgba(0, 0, 0, 0.34) 58%,
    transparent 84%
  );
}

.heroCopy {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 560px;
  justify-content: center;
}

/* ============ 文案 ============ */
.heroKicker {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* 从「胶囊标签」退化为宽字距小字 —— 暗房里不做装饰性色块 */
.heroEyebrow {
  display: inline-flex;
  padding: 0;
  border: none;
  border-radius: 0;
  background: none;
  font-size: 11px;
  font-weight: var(--font-weight-medium);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.5);
}

.heroCounter {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-4);
}

.heroTitle {
  margin: 0;
  font-size: var(--text-display);
  font-weight: var(--font-weight-light);
  letter-spacing: var(--tracking-tight);
  line-height: 1.04;
  color: #fff;
  text-shadow: none;
}

.heroMeta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  letter-spacing: 0.05em;
  color: rgba(255, 255, 255, 0.56);
}

.heroDescription {
  margin: 0;
  max-width: 480px;
  font-size: 13.5px;
  line-height: 1.85;
  color: rgba(255, 255, 255, 0.4);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ============ 轮播控件 ============ */
.heroCarouselControls {
  display: flex;
  align-items: center;
  gap: 14px;
}

.heroArrowButton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-muted);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition:
    border-color var(--duration-fast) var(--ease-default),
    color var(--duration-fast) var(--ease-default);
}

.heroArrowButton:hover {
  border-color: var(--border-strong);
  color: #fff;
}

.heroDots {
  display: flex;
  align-items: center;
  gap: 8px;
}

.heroDot {
  width: 6px;
  height: 6px;
  padding: 0;
  border-radius: var(--radius-full);
  border: none;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.2);
  transition:
    width var(--duration-micro) var(--ease-default),
    background var(--duration-micro) var(--ease-default);
}

.heroDot[data-active='true'] {
  width: 20px;
  background: #fff;
}

/* ============ 缩略图轨 ============ */
.heroThumbRail {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  padding: 4px 0;
  scrollbar-width: none;
}

.heroThumbRail::-webkit-scrollbar {
  display: none;
}

/* 不再是卡片：去掉底色与边框，只留内容 */
.heroThumb {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: none;
  border-radius: 0;
  background: none;
  color: inherit;
  cursor: pointer;
  text-align: left;
  opacity: 0.5;
  transition: opacity var(--duration-fast) var(--ease-default);
}

.heroThumb:hover {
  opacity: 0.82;
}

.heroThumb[data-active='true'] {
  opacity: 1;
}

.heroThumbIndex {
  font-size: 11px;
  font-weight: var(--font-weight-medium);
  font-variant-numeric: tabular-nums;
  color: var(--text-4);
}

.heroThumb[data-active='true'] .heroThumbIndex {
  color: var(--text-2);
}

.heroThumbImageWrap {
  width: 58px;
  height: 34px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  flex: 0 0 auto;
  background: var(--surface-1);
}

/* 选中项用封面主色的辉光标记，而不是描边卡片 */
.heroThumb[data-active='true'] .heroThumbImageWrap {
  box-shadow: var(--ring-selected), var(--glow-accent);
}

.heroThumbImage {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.heroThumbFallback {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: var(--text-2);
  font-size: 13px;
  font-weight: var(--font-weight-semibold);
}

.heroThumbText {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-width: 140px;
}

.heroThumbText strong {
  font-size: 12px;
  font-weight: var(--font-weight-normal);
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.heroThumb[data-active='true'] .heroThumbText strong {
  color: #fff;
}

.heroThumbText span {
  font-size: 11px;
  color: var(--text-4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============ 竖版海报 ============ */
/*
 * 暗房方案里 hero 只留一张背景大图 —— 竖版海报会和背景抢焦点，
 * 且把「无卡片」的观感又拉回卡片。此处整体隐藏，海报仍出现在下方各列表里。
 */
.heroPosterWrap {
  display: none;
}

.heroPoster {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: none;
  box-shadow: var(--shadow-l3), var(--glow-accent);
  display: block;
}

@media (max-width: 640px) {
  .heroLayout {
    background: linear-gradient(
      180deg,
      rgba(0, 0, 0, 0.35) 0%,
      rgba(0, 0, 0, 0.86) 55%,
      #000 100%
    );
  }

  .hero {
    min-height: 0;
  }

  .heroBackgroundImage {
    width: 100%;
    mask-image: radial-gradient(120% 78% at 62% 26%, #000 36%, transparent 88%);
    -webkit-mask-image: radial-gradient(120% 78% at 62% 26%, #000 36%, transparent 88%);
  }
}

  if (!ctx) {
    return DEFAULT_RGB;
  }
  ctx.drawImage(image, 0, 0, SAMPLE_SIZE, SAMPLE_SIZE);

  // 跨域未授权时 getImageData 会抛 SecurityError
  let data;
  try {
    data = ctx.getImageData(0, 0, SAMPLE_SIZE, SAMPLE_SIZE).data;
  } catch {
    return DEFAULT_RGB;
  }

  const weights = new Float64Array(HUE_BUCKETS);
  const satSums = new Float64Array(HUE_BUCKETS);

  for (let i = 0; i < data.length; i += 4) {
    const alpha = data[i + 3];
    if (alpha < 128) {
      continue;
    }
    const [h, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
    // 丢弃接近黑/白与近乎无彩的像素：它们决定不了「这张图是什么颜色」
    if (l < 0.12 || l > 0.92 || s < 0.12) {
      continue;
    }
    // 权重：饱和度越高、亮度越靠中间，越能代表画面主色
    const weight = s * s * (1 - Math.abs(l - 0.5) * 1.2);
    if (weight <= 0) {
      continue;
    }
    const bucket = Math.min(HUE_BUCKETS - 1, Math.floor((h / 360) * HUE_BUCKETS));
    weights[bucket] += weight;
    satSums[bucket] += s * weight;
  }

  let best = -1;
  let bestWeight = 0;
  for (let i = 0; i < HUE_BUCKETS; i += 1) {
    if (weights[i] > bestWeight) {
      bestWeight = weights[i];
      best = i;
    }
  }

  if (best < 0 || bestWeight === 0) {
    return DEFAULT_RGB;
  }

  const hue = ((best + 0.5) / HUE_BUCKETS) * 360;
  const saturation = clamp(satSums[best] / bestWeight, 0.34, 0.7);
  return hslToRgb(hue, saturation, 0.68);
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}


function rgbToHsl(r8, g8, b8) {
  const r = r8 / 255;
  const g = g8 / 255;
  const b = b8 / 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) / 2;
  const delta = max - min;

  if (delta === 0) {
    return [0, 0, l];
  }

  const s = l > 0.5 ? delta / (2 - max - min) : delta / (max + min);

  let h;
  if (max === r) {
    h = ((g - b) / delta) % 6;
  } else if (max === g) {
    h = (b - r) / delta + 2;
  } else {
    h = (r - g) / delta + 4;
  }
  h *= 60;
  if (h < 0) {
    h += 360;
  }
  return [h, s, l];
}

function hslToRgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;

  let rgb;
  if (h < 60) {
    rgb = [c, x, 0];
  } else if (h < 120) {
    rgb = [x, c, 0];
  } else if (h < 180) {
    rgb = [0, c, x];
  } else if (h < 240) {
    rgb = [0, x, c];
  } else if (h < 300) {
    rgb = [x, 0, c];
  } else {
    rgb = [c, 0, x];
  }

  return [
    Math.round((rgb[0] + m) * 255),
    Math.round((rgb[1] + m) * 255),
    Math.round((rgb[2] + m) * 255),
  ];
}

const img = document.getElementById('heroImg');
function run(){
  const rgb = extractAccent(img);
  document.documentElement.style.setProperty('--content-accent', `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`);
  document.documentElement.style.setProperty('--content-accent-rgb', `${rgb[0]} ${rgb[1]} ${rgb[2]}`);
}
if (img.complete) run(); else img.onload = run;
